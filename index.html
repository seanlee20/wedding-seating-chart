<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wedding Seating — Find Your Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8f6f3;--card:#ffffff;--accent:#8b5cf6;--muted:#6b6b6b}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,var(--bg),#fff);color:#222}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px}
    .card{width:100%;max-width:760px;background:var(--card);padding:36px;border-radius:16px;box-shadow:0 10px 30px rgba(18,18,18,0.06)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-family:'Playfair Display',serif;margin:0;font-size:28px}
    p.lead{margin:6px 0 0;color:var(--muted)}
    .search{display:flex;gap:12px;margin:18px 0}
    input.searchbox{flex:1;padding:14px 16px;border-radius:10px;border:1px solid #eee;font-size:16px}
    button.clear{padding:12px 16px;border-radius:10px;border:none;background:#f1f1f1}
    .result{margin-top:10px;padding:18px;border-radius:12px;border:1px dashed #eee;background:linear-gradient(180deg, #fff, #fcfcff)}
    .tableBadge{display:inline-block;margin-top:6px;padding:8px 12px;border-radius:999px;background:linear-gradient(90deg, rgba(139,92,246,0.12), rgba(139,92,246,0.06));color:var(--accent);font-weight:600}
    .note{font-size:13px;color:var(--muted);margin-top:12px}
    footer.small{margin-top:18px;font-size:13px;color:var(--muted)}
    .admin{margin-top:20px;border-top:1px dashed #eee;padding-top:16px}
    .table-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
    .table-card{padding:12px;border-radius:8px;background:#fafafa;border:1px solid #f0eff8}
    .hidden{display:none}
    @media (max-width:520px){.page{padding:20px}.card{padding:20px}}
  </style>
</head>
<body>
  <div class="page">
    <main class="card" role="main">
      <header>
        <div>
          <h1>Wedding Seating Chart</h1>
          <p class="lead">Type your name and we'll find your table</p>
        </div>
        <div style="text-align:right">
          <small style="color:var(--muted)">Wedding — May 23, 2026</small>
        </div>
      </header>

      <div class="search">
        <input id="query" class="searchbox" placeholder="Enter your full name (e.g. Sean Lee)" autofocus />
        <button id="clearBtn" class="clear" title="Clear">✕</button>
      </div>

      <div id="resultArea" class="result hidden" aria-live="polite"></div>

      <p class="note">Tip: spelling doesn't have to be exact — try first or last name only.</p>

      <div id="tables" class="table-list" aria-hidden="true"></div>
    </main>
  </div>

<script>
// --- CONFIG: you can replace this by hosting a guests.json file next to index.html ---
// By default this will attempt to fetch ./guests.json. If not present, it falls back to an embedded sample list.
const GUESTS_JSON_PATH = './guests.json';

let guests = [];

async function loadGuests(){
  try{
    const res = await fetch(GUESTS_JSON_PATH, {cache: 'no-store'});
    if(!res.ok) throw new Error('no external file');
    guests = await res.json();
    console.log(`Loaded ${guests.length} guests from guests.json`);
  }catch(e){
    // fallback sample data
    guests = [
      {"name":"Amanda Lee","table":"1"},
      {"name":"Marcus Chen","table":"1"},
      {"name":"Samir Patel","table":"5"},
      {"name":"Olivia Gomez","table":"3"},
      {"name":"Ethan Brown","table":"2"}
    ];
    console.log('Using embedded sample guest list — create guests.json to customize.');
  }
}

function normalize(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}

function findMatches(query){
  const q = normalize(query);
  if(!q) return [];
  // match if name contains all tokens in q (order-insensitive)
  const qtok = q.split(' ');
  return guests.filter(g=>{
    const name = normalize(g.name);
    return qtok.every(t=>name.includes(t));
  });
}

function showResult(matches, query){
  const area = document.getElementById('resultArea');
  const tablesContainer = document.getElementById('tables');
  if(!query){ area.classList.add('hidden'); tablesContainer.setAttribute('aria-hidden','true'); tablesContainer.innerHTML=''; return }

  if(matches.length===0){
    area.innerHTML = `<strong>No match</strong><div class="note">We couldn't find that name. Try first name only or check spelling.</div>`;
    area.classList.remove('hidden');
    tablesContainer.setAttribute('aria-hidden','true');
    tablesContainer.innerHTML='';
    return;
  }

  // If exact single match, show table big
  if(matches.length===1){
    const m = matches[0];
    area.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><strong style=\"font-size:18px\">${escapeHtml(m.name)}</strong><div class=\"note\">You are seated at</div></div><div class=\"tableBadge\">Table ${escapeHtml(m.table)}</div></div>`;
    area.classList.remove('hidden');
    tablesContainer.setAttribute('aria-hidden','true');
    tablesContainer.innerHTML='';
    return;
  }

  // multiple matches — show list of names and their tables
  const rows = matches.map(m=>`<div class="table-card"><strong>${escapeHtml(m.name)}</strong><div class="note">Table ${escapeHtml(m.table)}</div></div>`).join('');
  area.innerHTML = `<strong>Multiple matches (${matches.length})</strong><div class="note">Select your name below.</div>`;
  area.classList.remove('hidden');
  tablesContainer.setAttribute('aria-hidden','false');
  tablesContainer.innerHTML = rows;
}

function escapeHtml(s){return String(s).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))}

// UI wiring
document.getElementById('query').addEventListener('input', e=>{
  const q = e.target.value;
  const matches = findMatches(q);
  showResult(matches, q);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  const q = document.getElementById('query'); q.value=''; q.focus(); showResult([], '');
});

// load guests on start
loadGuests();

// Accessibility: allow Enter to focus first result (useful on mobile)
document.getElementById('query').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    // if a single match, announce
    const q = e.target.value; const matches = findMatches(q);
    showResult(matches, q);
  }
});
</script>
</body>
</html>
